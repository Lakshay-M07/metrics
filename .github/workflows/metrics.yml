name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-M07
          output_action: commit
          filename: github-metrics.svg

          
      - name: Introduction
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-M07
          filename: github-metrics-introduction.svg
          base: ""
          plugin_introduction: yes


      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-M07
          filename: github-metrics-languages.svg

          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes

          commits_authoring: Lakshay-M07, lakshay.mohata@gmail.com

          plugin_languages_sections: most-used,recently-used
          plugin_languages_details: bytes-size,percentage,lines


      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Lakshay-M07
          filename: github-metrics-achievements.svg
          
          base: ""

          plugin_achievements: yes
          plugin_achievements_display: compact

          # Show locked achievements too
          plugin_achievements_threshold: X

          # Include hidden achievements
          plugin_achievements_secrets: yes

          # Show all achievements
          plugin_achievements_limit: 0  

          
        
           
